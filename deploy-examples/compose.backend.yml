services:
  backend:
    image: ${CLOUDMUSIC2KTV_BACKEND_IMAGE:-docker.io/lamptales/cloudmusic2ktv-backend:latest}
    environment:
      CLOUDMUSIC2KTV_HOST: 0.0.0.0
      CLOUDMUSIC2KTV_PORT: 7860
      CLOUDMUSIC2KTV_BASE_PATH: ${CLOUDMUSIC2KTV_BASE_PATH:-}
      CLOUDMUSIC2KTV_TRUST_PROXY: ${CLOUDMUSIC2KTV_TRUST_PROXY:-1}
      CLOUDMUSIC2KTV_ALLOW_INSECURE_COOKIE_IMPORT: ${CLOUDMUSIC2KTV_ALLOW_INSECURE_COOKIE_IMPORT:-0}
      CLOUDMUSIC2KTV_CORS_ORIGINS: ${CLOUDMUSIC2KTV_CORS_ORIGINS:-}
      CLOUDMUSIC2KTV_SESSION_DAYS: ${CLOUDMUSIC2KTV_SESSION_DAYS:-90}
      CLOUDMUSIC2KTV_MEDIA_URL_TTL_SECONDS: ${CLOUDMUSIC2KTV_MEDIA_URL_TTL_SECONDS:-3600}
      CLOUDMUSIC2KTV_PLAYLIST_CACHE_TTL_SECONDS: ${CLOUDMUSIC2KTV_PLAYLIST_CACHE_TTL_SECONDS:-21600}
      CLOUDMUSIC2KTV_PLAYLIST_CACHE_MAX_ENTRIES: ${CLOUDMUSIC2KTV_PLAYLIST_CACHE_MAX_ENTRIES:-32}
      CLOUDMUSIC2KTV_MEDIA_SIGNING_KEY: ${CLOUDMUSIC2KTV_MEDIA_SIGNING_KEY:-}
      CLOUDMUSIC2KTV_FONT_DIR: /usr/share/fonts/opentype/noto
      LYRIC_DEMUCS_MODEL_PATH: ${LYRIC_DEMUCS_MODEL_PATH:-/models/huggingface/hub/models--adefossez--HTDemucs/snapshots/cbc8a9b1a87023b7fd74e7b3412e6321c0eab003}
      LYRIC_CTC_MODEL_PATH: ${LYRIC_CTC_MODEL_PATH:-/models/huggingface/hub/models--jonatasgrosman--wav2vec2-large-xlsr-53-japanese/snapshots/cf031e020336460d15a417eba710bbc5bb43be9a}
      LYRIC_DEVICE: ${LYRIC_DEVICE:-cpu}
      LYRIC_OFFSET_BOUNDARY_CHECK: ${LYRIC_OFFSET_BOUNDARY_CHECK:-true}
      LYRIC_OFFSET_SILENCE_MS: ${LYRIC_OFFSET_SILENCE_MS:-2000}
      LYRIC_OFFSET_SUSTAIN_MS: ${LYRIC_OFFSET_SUSTAIN_MS:-200}
      LYRIC_OFFSET_BOUNDARY_TOLERANCE_MS: ${LYRIC_OFFSET_BOUNDARY_TOLERANCE_MS:-800}
      LYRIC_OFFSET_ACOUSTIC_VERIFY: ${LYRIC_OFFSET_ACOUSTIC_VERIFY:-false}
      LYRIC_OFFSET_ACOUSTIC_MIN_MARGIN: ${LYRIC_OFFSET_ACOUSTIC_MIN_MARGIN:-0.15}
      LYRIC_CTC_SCORE_THRESHOLD: ${LYRIC_CTC_SCORE_THRESHOLD:--1.5}
      LYRIC_CTC_COVERAGE_THRESHOLD: ${LYRIC_CTC_COVERAGE_THRESHOLD:-0.8}
      LYRIC_CTC_MARGIN_MS: ${LYRIC_CTC_MARGIN_MS:-500}
      LYRIC_CTC_ACTIVITY_MARGIN_MS: ${LYRIC_CTC_ACTIVITY_MARGIN_MS:-120}
      LYRIC_ACTIVITY_CONFIDENCE_THRESHOLD: ${LYRIC_ACTIVITY_CONFIDENCE_THRESHOLD:-0.45}
      LYRIC_G2P_BACKEND: sudachi
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CLOUDMUSIC2KTV_MODEL_SWEEP_GAP_THRESHOLD_MS: ${CLOUDMUSIC2KTV_MODEL_SWEEP_GAP_THRESHOLD_MS:-200}
    ports:
      - "${CLOUDMUSIC2KTV_BACKEND_BIND_ADDRESS:-127.0.0.1}:${CLOUDMUSIC2KTV_BACKEND_PORT:-7860}:7860"
    volumes:
      - ./docker-data/instance:/app/instance
      - ./docker-data/outputs:/app/outputs
      - ${LYRIC_MODELS_DIR:?Set the host model directory}:/models:ro
    restart: unless-stopped
