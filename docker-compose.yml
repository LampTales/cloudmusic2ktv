services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${CLOUDMUSIC2KTV_BACKEND_IMAGE:-cloudmusic2ktv-backend:local}
    environment:
      CLOUDMUSIC2KTV_HOST: 0.0.0.0
      CLOUDMUSIC2KTV_PORT: 7860
      CLOUDMUSIC2KTV_TRUST_PROXY: "1"
      CLOUDMUSIC2KTV_ALLOW_INSECURE_COOKIE_IMPORT: "1"
      CLOUDMUSIC2KTV_PLAYLIST_CACHE_TTL_SECONDS: ${CLOUDMUSIC2KTV_PLAYLIST_CACHE_TTL_SECONDS:-21600}
      CLOUDMUSIC2KTV_PLAYLIST_CACHE_MAX_ENTRIES: ${CLOUDMUSIC2KTV_PLAYLIST_CACHE_MAX_ENTRIES:-32}
      CLOUDMUSIC2KTV_FONT_DIR: /usr/share/fonts/opentype/noto
    volumes:
      - ./docker-data/instance:/app/instance
      - ./docker-data/outputs:/app/outputs
    expose:
      - "7860"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${CLOUDMUSIC2KTV_FRONTEND_IMAGE:-cloudmusic2ktv-frontend:local}
    environment:
      BACKEND_UPSTREAM: http://backend:7860
    ports:
      - "${CLOUDMUSIC2KTV_BIND_ADDRESS:-127.0.0.1}:${CLOUDMUSIC2KTV_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
